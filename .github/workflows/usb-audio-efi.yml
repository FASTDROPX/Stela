# Build the experimental EFI with the upstream release recipe.
# Existing macOS installs can test USB audio without packaging Stela.app.
# This workflow only uploads a test artifact.
name: USB audio test image

on:
  push:
    branches: [codex/usb-audio-build]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  efi:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - name: Install Clang 21 and the GPU host tools
        run: |
          # The kext needs upstream Clang 21 or newer for arm64e. The Intel
          # and AMD Vulkan drivers' builds run glslangValidator 12.2 or newer
          # and mesa_clc, which links LLVM 21 and libclang-cpp 21 (and the
          # SPIR-V libraries spirv.sh builds below).
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            clang-21 lld-21 llvm-21 llvm-21-dev libclang-21-dev libclang-cpp21-dev \
            glslang-tools ninja-build
          echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-efi-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'crates/stela-boot/Cargo.lock') }}
          restore-keys: cargo-efi-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Install Rust
        run: |
          rustup toolchain install
          rustc --version
          version="$(clang --version)"
          echo "${version%%$'\n'*}"
          [[ "$version" =~ version\ (2[1-9]|[3-9][0-9])\. ]] || { echo "::error::clang on PATH is older than 21"; exit 1; }

      - name: Cache keys
        id: keys
        run: |
          pins="$(git ls-tree HEAD third_party | sha256sum | cut -c1-16)"
          llvm="$(clang --version | head -1)"
          tools="$(printf '%s\n%s\n%s\n' "$llvm" "$(rustc --version)" "$(glslangValidator --version | head -1)" | sha256sum | cut -c1-16)"
          echo "nvk=$pins-$tools" >> "$GITHUB_OUTPUT"
          echo "llvm=$(echo "$llvm" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          # The tools' virtual environment names the image's Python.
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .tools/gpu
          key: gpu-tools-${{ steps.keys.outputs.image }}-${{ hashFiles('xtask/src/gpu/toolchain.rs') }}

      - uses: actions/cache@v4
        id: spirv
        with:
          path: .tools/spirv
          key: spirv-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.llvm }}-${{ hashFiles('.github/spirv.sh') }}

      - name: SPIR-V libraries
        run: |
          if [[ "${{ steps.spirv.outputs.cache-hit }}" != true ]]; then
            bash .github/spirv.sh .tools/spirv
          fi
          echo "PKG_CONFIG_PATH=$PWD/.tools/spirv/lib/pkgconfig" >> "$GITHUB_ENV"

      # Mesa and LLVM compiled for stela.efi. Only an exact key restores:
      # it covers every input of `target/gpu`.
      - uses: actions/cache@v4
        id: nvk
        with:
          path: target/gpu
          key: nvk-${{ steps.keys.outputs.nvk }}-${{ hashFiles('xtask/src/gpu/**', 'crates/stela-driver-gpu/**', 'third_party/patches/**', 'third_party/*.sparse', '.github/spirv.sh') }}

      - name: Fetch upstream sources
        run: cargo xtask gpu fetch

      - name: Keep the restored Mesa and LLVM build current
        if: steps.nvk.outputs.cache-hit == 'true'
        run: |
          # A fresh checkout is newer than the restored objects; the key
          # proved the sources the same, so date them before the objects.
          find third_party crates/stela-driver-gpu -path '*/.git' -prune -o -type f -print0 \
            | xargs -0 touch -h -d '2000-01-01T00:00:00Z'

      # A release fails where a local build would leave out a Vulkan driver
      # the image gives its GPUs (`released` in xtask/src/gpu/nvk.rs).
      - name: Build stela.efi
        env:
          STELA_RELEASE: "1"
        run: |
          cargo xtask boot build --release
          echo "Vulkan drivers: $(paste -sd, target/gpu/nvk/vulkan-drivers)" >> "$GITHUB_STEP_SUMMARY"
          efi=target/boot/x86_64-unknown-uefi/release/stela-deploy.efi
          [[ "$(head -c 2 "$efi")" == MZ ]] || { echo "::error::$efi is not a PE image"; exit 1; }
          mkdir -p dist
          cp "$efi" dist/stela.efi
          (cd dist && sha256sum stela.efi > SHA256SUMS)
          ls -l dist/stela.efi
          { echo "stela.efi: $(stat -c %s dist/stela.efi) bytes"; echo "sha256 $(sha256sum dist/stela.efi | cut -d' ' -f1)"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: stela-efi
          path: |
            dist/stela.efi
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
